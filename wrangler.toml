name = "expression-drill"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Mini App (public/drill/) is served as static assets; other paths fall through to the Worker.
assets = { directory = "public" }

[[d1_databases]]
binding = "DB"
database_name = "expression-drill"
database_id = "50bb8f7a-69cd-4e7c-9c0d-63b39743bd52"
migrations_dir = "migrations"

# secrets: SYNC_TOKEN, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ADMIN_CHAT_ID

[triggers]
crons = ["0 * * * *"]

[vars]
PUBLIC_URL = "https://expression-drill.maikhaihuy.workers.dev"
DEFAULT_TZ_OFFSET_MIN = "420"
BATCH_HOURS = "7,12,17,22"
BATCH_MIN = "5"
BATCH_MAX = "15"
DRILL_REMINDER_HOUR = "17"
QUIET_START_HOUR = "22"   # due times after this hour…
QUIET_END_HOUR = "7"      # …or before this hour move to QUIET_END_HOUR next morning
NEW_PER_BATCH = "3"
NEW_PER_DAY = "20"
DRILL_SECONDS = "300"
CARD_SECONDS = "10"
DRILL_DECK_SIZE = "60"
